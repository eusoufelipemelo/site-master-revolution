server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # o Vite versiona o nome dos arquivos, então eles podem ser cacheados forte
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  # imagens e logos vêm de public/, sem hash: cache curto e revalidação
  location ~* \.(svg|jpg|jpeg|png|webp|ico)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
  # SPA de página única
  location / {
    try_files $uri $uri/ /index.html;
  }
}
